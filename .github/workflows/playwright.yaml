name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    
  workflow_dispatch:
    inputs:
      grep: 
        description: "Campo opcional para filtrar los tests de playwright"
        required: false
        default: ''
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        if [ -n "${{ inputs.grep }}" ]; then
          npx playwright test --grep "${{ inputs.grep }}"
        else
          npx playwright test
        fi
      env:
        SD_PASSWORD: ${{ secrets.SD_PASSWORD }}
        STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
        LOCKOUT_USERNAME: ${{ secrets.LOCKOUT_USERNAME }}
        PROBLEM_USERNAME: ${{ secrets.PROBLEM_USERNAME }}
        PERFORMANCE_GLITCH_USERNAME: ${{ secrets.PERFORMANCE_GLITCH_USERNAME }}
        ERROR_USERNAME: ${{ secrets.ERROR_USERNAME }}
        VISUAL_USERNAME: ${{ secrets.VISUAL_USERNAME }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
